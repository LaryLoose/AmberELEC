## Hostname or IP-address of host to connect to
## By default the host is autodiscovered on the LAN using mDNS
#address = 1.2.3.4

## Video streaming configuration
## Width/Height are replaced with the framebuffer resolution on first boot
width = @MWIDTH@
height = @MHEIGHT@
fps = 60

## Output rotation (independent of framebuffer settings!)
## Allowed values: 0, 90, 180, 270
#rotation = 0

## Bitrate in Kbps; set to -1 to pick a default based on resolution/fps
bitrate = 15000

## Size of network packets, should be lower than the MTU
#packetsize = 1392

## Video codec (auto/h264/h265)
codec = h264

## Default application launched on the host
#app = Steam

## Play audio on the host instead of streaming it to the client
#localaudio = false

## Send a quit-app request to the host after the session ends
quitappafter = true

## Video/audio decoder backend
## rk - Rockchip hardware decoder (RK3326/RK3399)
## sdl - software decoder
platform = rk

## Optimize QOS for internet (yes) or LAN (no); auto decides by target IP
#remote = auto

## Swap A/B on the client OSD only (host still receives the real buttons)
#swapclientab = true

## OSD icon style (0-9); the in-stream menu writes this automatically
#osdstyle = 0
